# Perfil "test": H2 em memoria por padrao (suas falses garantem CI/IDE rapida).
# A Fase 3 do plano QA permite executar esta MESMA suite contra PostgreSQL 17 +
# Flyway (job CI backend-postgres e docker-compose local) sobrescrevendo apenas
# as variaveis TEST_* abaixo - nenhum default aqui precisa mudar.
# Defaults preservados: H2 MODE=PostgreSQL, flyway off, create-drop, H2Dialect.

spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:create-drop}
spring.jpa.properties.hibernate.dialect=${TEST_DIALECT:org.hibernate.dialect.H2Dialect}

jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy0yNTYtYml0cy1sb25nLWVub3VnaA==
jwt.expiration=900000
refresh.token.expiration=604800000
password-reset.token.expiration=3600000
email-verification.token.expiration=86400000

cookie.secure=false
cookie.same.site=Lax
cookie.access.path=/
cookie.refresh.path=/api/auth

cors.allowed.origins=http://localhost,http://26.220.230.81
