spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

cookie.secure=${COOKIE_SECURE}
cookie.same.site=${COOKIE_SAME_SITE}
cookie.access.path=${COOKIE_ACCESS_PATH:/}
cookie.refresh.path=${COOKIE_REFRESH_PATH:/auth}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

server.address=0.0.0.0
server.port=8080

# Confia em X-Forwarded-* apenas quando a conexao vem de um proxy interno
# (nginx/Render). Sem isso, request.getRemoteAddr() devolve o IP do proxy e
# TODOS os usuarios compartilham o mesmo bucket de rate limit (OPSIRE-CTRL-005).
server.forward-headers-strategy=native

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
