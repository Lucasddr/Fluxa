# PostgreSQL 17 de teste (Fase 3 do plano QA) - mesmo dialeto do Supabase.
#
# NAO CONFUNDIR: o docker-compose.yml da raiz sobe o stack E2E local completo
# (postgres dev + backend + nginx). Este arquivo sobe APENAS um PostgreSQL
# descartavel para executar a suite backend contra o dialeto de producao.
#
# Uso local (requer Docker):
#   docker compose -f docker-compose.test.yml up -d --wait
#   $env:TEST_DB_URL = "jdbc:postgresql://localhost:15432/fluxa_test"
#   $env:TEST_DB_DRIVER = "org.postgresql.Driver"
#   $env:TEST_DB_USERNAME = "fluxa"
#   $env:TEST_DB_PASSWORD = "fluxa"
#   $env:TEST_FLYWAY_ENABLED = "true"
#   $env:TEST_DDL_AUTO = "validate"
#   $env:TEST_DIALECT = "org.hibernate.dialect.PostgreSQLDialect"
#   cd backend; .\mvnw.cmd -B test
#   docker compose -f docker-compose.test.yml down
#
# O container nao tem volume: `down` zera o banco, garantindo migrations
# limpas V1-V12 em cada execucao. Porta 15432 para nao colidir com o
# PostgreSQL dev (5433) do docker-compose.yml nem com instalacoes locais.

services:
  postgres-test:
    image: postgres:17
    container_name: fluxa-pg-test
    environment:
      POSTGRES_USER: fluxa
      POSTGRES_PASSWORD: fluxa
      POSTGRES_DB: fluxa_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxa -d fluxa_test"]
      interval: 5s
      timeout: 5s
      retries: 10
